[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbg2sed2"
version = "0.0.1"
description = "Read Process Bigraph documents (statically) and survey, classify and, where possible, translate them to SED2."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# The reader and the survey need only PyYAML and the standard library.  libsed2 (not on PyPI) is needed by the emit
# phase (it validates before writing anything); the verification needs process-bigraph and the document's classes.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# emit: Antimony to SBML, reading SBML elements.  libsed2 (validation before writing) is installed from its wheel.
emit = ["antimony>=2.15", "python-libsbml>=5.20"]
dev = ["pytest>=8"]

[project.scripts]
pbg2sed2-survey = "pbg2sed2.survey:main"
pbg2sed2 = "pbg2sed2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbg2sed2 = ["known_classes.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
